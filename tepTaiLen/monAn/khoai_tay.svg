<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ca8a04;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="400" height="300" rx="20" fill="url(#grad)" />
  
  <!-- Họa tiết trang trí nền -->
  <circle cx="350" cy="50" r="80" fill="rgba(255,255,255,0.08)" />
  <circle cx="50" cy="250" r="60" fill="rgba(255,255,255,0.06)" />
  
  <!-- Vòng tròn tâm điểm món ăn -->
  <circle cx="200" cy="120" r="65" fill="#ffffff" filter="url(#shadow)" />
  <text x="200" y="145" font-size="64" text-anchor="middle">🍟</text>
  
  <!-- Tên món và mô tả -->
  <rect x="30" y="210" width="340" height="65" rx="12" fill="rgba(255,255,255,0.92)" filter="url(#shadow)" />
  <text x="200" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Khoai Tây Chiên Bơ Tỏi</text>
  <text x="200" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Giòn rụm, sốt bơ tỏi béo ngậy</text>
</svg>