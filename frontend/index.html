<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Nhà Hàng & Gọi Món QR - Quán Mộc</title>
    <link rel="stylesheet" href="/tepGiaoDien.css">

    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="ung-dung-khung">
        <!-- Thanh điều hướng bên (Sidebar) -->
        <aside class="thanh-ben" id="thanh-ben">
            <div class="logo-quan">
                <span>🍲</span>
                <span>QUÁN MỘC POS</span>
            </div>
            <ul class="menu-dieu-huong" id="menu-chinh">
                <li><a href="#/so-do-ban" id="link-so-do-ban"><span>🪑</span> Sơ đồ Bàn & POS</a></li>
                <li><a href="#/bep" id="link-bep"><span>🍳</span> Điều phối Bếp (KDS)</a></li>
                <li><a href="#/ca-lam-viec" id="link-ca-lam-viec"><span>💼</span> Quản lý Ca & Quỹ</a></li>
                <li><a href="#/thong-ke" id="link-thong-ke"><span>📊</span> Báo cáo Doanh thu</a></li>
                <li><a href="#/danh-gia" id="link-danh-gia"><span>⭐</span> Đánh giá Khách</a></li>
                <li><a href="#/thuc-don" id="link-thuc-don"><span>📋</span> Quản lý Thực đơn</a></li>
                <li><a href="#/nhan-vien" id="link-nhan-vien"><span>👥</span> Quản lý Nhân sự</a></li>

            </ul>
        </aside>

        <!-- Khung nội dung chính -->
        <div class="vung-chinh">
            <header class="dau-trang" id="dau-trang">
                <div style="font-weight: 600; font-size: 16px;" id="ten-nha-hang-hien-thi">
                    Nhà Hàng Quán Mộc
                </div>
                <div class="thong-tin-nguoi-dung" id="khung-nguoi-dung">
                    <span class="the-ten-vai-tro" id="nhan-vai-tro">Quản lý</span>
                    <span style="font-weight: 600;" id="ten-nguoi-dung">Quản Trị Viên</span>
                    <button class="nut nut-phu nut-nho" id="nut-dang-xuat">Đăng xuất</button>
                </div>
            </header>

            <main class="noi-dung-trang" id="noi-dung-chinh">
                <!-- Nội dung các view sẽ được nạp tại đây -->
            </main>
        </div>
    </div>

    <!-- Nơi render Modal toàn cục -->
    <div id="vung-modal"></div>

    <script type="module" src="/ungDung.js"></script>
